version: "3.8"

services:
  java-app:
    build:
      context: .
    container_name: "expensesapp"
    networks:
      - expenses-app-nw 
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/expenses_tracker?allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Test@123
    depends_on:
      - mysql_db
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 ||exit1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

    mysql_db:
      image: mysql
      container_name: "mysql"
      networks:
        - expenses-app-nw 
      environment:
        MYSQL_ROOT_PASSWORD: Test@123
        MYSQL_DATABASE: expenses_tracker
      restart: always
      ports:
        - "3306:3306"
      volumes:
        - ./mysql-data:/var/lib/mysql
      healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-pTest@123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  expenses-app-nw: